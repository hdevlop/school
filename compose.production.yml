x-app: &app
  # Demo follows :demo; each customer selects an accepted @sha256:... digest.
  # Always pull so the floating demo tag also updates on a redeployment.
  image: ${SCHOOL_IMAGE:?SCHOOL_IMAGE must select a release}
  pull_policy: always
  env_file:
    # Dokploy writes this installation's environment into its own checkout.
    # Never load a shared host file: omitted keys must not inherit demo secrets.
    - ./.env
  environment: &runtime-environment
    SCHOOL_STORAGE_PATH: /srv/school/storage
    # Publish the bundled landing on first initialization unless explicitly disabled.
    SCHOOL_SEED_LANDING: ${SCHOOL_SEED_LANDING:-true}
  volumes:
    - type: bind
      source: ${SCHOOL_STORAGE_HOST_PATH:?SCHOOL_STORAGE_HOST_PATH must be unique to this installation}
      target: /srv/school/storage
      bind:
        create_host_path: false
  networks:
    - backend
    - frontend
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *app
    restart: unless-stopped
    mem_limit: ${SCHOOL_APP_MEMORY:-1024m}
    cpus: ${SCHOOL_APP_CPUS:-1.5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${SCHOOL_LOOPBACK_PORT:?SCHOOL_LOOPBACK_PORT must be unique to this installation}:3000
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health/status');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  migrate:
    <<: *app
    restart: "no"
    mem_limit: ${SCHOOL_MIGRATE_MEMORY:-768m}
    cpus: ${SCHOOL_MIGRATE_CPUS:-1.0}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    # Initialize the bundled landing once by default. Saved rows are preserved.
    # Customer installations can explicitly opt out. Fail on invalid flags
    # before migrating so a typo cannot silently change initialization behavior.
    command:
      - sh
      - -ec
      - |
        case "$$SCHOOL_SEED_LANDING" in
          true|false) ;;
          *) echo 'SCHOOL_SEED_LANDING must be true or false' >&2; exit 1 ;;
        esac
        bun x drizzle-kit migrate
        if [ "$$SCHOOL_SEED_LANDING" = true ]; then bun run seed:landing; fi

  notifications-worker:
    <<: *app
    restart: unless-stopped
    mem_limit: ${SCHOOL_WORKER_MEMORY:-384m}
    cpus: ${SCHOOL_WORKER_CPUS:-0.5}
    networks:
      - backend
      - notifications-egress
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["bun", "run", "notifications:worker"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const {Redis}=await import('ioredis');const r=new Redis(process.env.REDIS_URL,{lazyConnect:true,maxRetriesPerRequest:1});try{await r.connect();const v=await r.get('school:notifications:worker:heartbeat');await r.quit();process.exit(v?0:1)}catch{process.exit(1)}\""]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    mem_limit: ${SCHOOL_POSTGRES_MEMORY:-768m}
    cpus: ${SCHOOL_POSTGRES_CPUS:-1.0}
    environment:
      # Resolved from this installation's Dokploy environment only.
      POSTGRES_DB: ${POSTGRES_DB:-school_production}
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
      # Dokploy replaces the routed app service's declared networks with its
      # external proxy network plus `default`. Keep Postgres on that internal
      # network as well so the converted app can still resolve `postgres`.
      - default
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Authentication throttles are security state, so production must not use a
  # per-process memory cache that resets on each deployment.
  redis:
    image: redis:7.4.5-bookworm
    restart: unless-stopped
    mem_limit: ${SCHOOL_REDIS_MEMORY:-192m}
    cpus: ${SCHOOL_REDIS_CPUS:-0.25}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_MAXMEMORY: ${SCHOOL_REDIS_MAXMEMORY:-96mb}
    # Throttle counters and sessions must not be silently evicted under load.
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - backend
      - default
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  default:
    internal: true
  backend:
    internal: true
  frontend:
  notifications-egress:

volumes:
  postgres_data:
  redis_data:
