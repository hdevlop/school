name: school

x-app: &app
  # The GitHub workflow publishes this tag immediately before calling the
  # Dokploy webhook. Always pull it so a successful webhook cannot leave an
  # older SHA-pinned container running.
  image: ghcr.io/hdevlop/school:main
  pull_policy: always
  env_file:
    # Dokploy writes the service's encrypted environment to this file in its
    # deployment checkout. Direct host runs fall through to the root-only file.
    - path: ./.env
      required: false
    - path: /opt/school/env/app.env
      required: false
  volumes:
    - type: bind
      source: ${SCHOOL_STORAGE_HOST_PATH:-/srv/school/storage-demo}
      target: /srv/school/storage
      bind:
        create_host_path: false
  networks:
    - backend
    - frontend
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SCHOOL_LOOPBACK_PORT:-3400}:3000
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/api/health/status');process.exit(r.ok?0:1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bun", "x", "drizzle-kit", "migrate"]

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file:
      - path: /opt/school/env/infrastructure.env
        required: false
    environment:
      # Dokploy resolves these from its generated .env. They intentionally
      # override the optional host-only env_file without exposing app secrets.
      POSTGRES_DB: ${POSTGRES_DB:-school_production}
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
      # Dokploy replaces the routed app service's declared networks with its
      # external proxy network plus `default`. Keep Postgres on that internal
      # network as well so the converted app can still resolve `postgres`.
      - default
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Authentication throttles are security state, so production must not use a
  # per-process memory cache that resets on each deployment.
  redis:
    image: redis:7.4.5-bookworm
    restart: unless-stopped
    env_file:
      - path: /opt/school/env/infrastructure.env
        required: false
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - backend
      - default
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  default:
    internal: true
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  redis_data:
