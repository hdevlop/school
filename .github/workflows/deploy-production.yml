name: Verify, publish, and deploy School demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: school-deploy-demo
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  IMAGE_NAME: ghcr.io/hdevlop/school
  NEXT_PUBLIC_FORM_FILL_ENABLED: "false"

jobs:
  classify:
    name: Classify deployment impact
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.impact.outputs.runtime_changed }}
    steps:
      - name: Check out exact revision and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect runtime-relevant paths
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual deployment requested; runtime publication is enabled."
            exit 0
          fi

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(
              git diff \
                --name-only \
                --diff-filter=ACDMRT \
                "$BEFORE_SHA" \
                "$GITHUB_SHA"
            )
          else
            mapfile -t changed_files < <(
              git diff-tree \
                --root \
                --no-commit-id \
                --name-only \
                -r \
                "$GITHUB_SHA"
            )
          fi

          runtime_changed=false
          # Only documentation and evidence can skip runtime publication.
          for path in "${changed_files[@]}"; do
            case "$path" in
              docs/evidence/* | docs/*.md)
                ;;
              *)
                runtime_changed=true
                echo "Runtime-relevant path: $path"
                ;;
            esac
          done

          echo "runtime_changed=$runtime_changed" >> "$GITHUB_OUTPUT"
          if [ "$runtime_changed" = "true" ]; then
            echo "Application image publication and deployment are required."
          else
            echo "Only documentation or evidence changed; publication and deployment will be skipped."
          fi

  verify:
    name: Verify
    needs: classify
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://build:build@127.0.0.1:5432/build
      FRONTEND_URL: https://build.example.invalid
      NAJM_AUTH_INTERNAL_URL: http://127.0.0.1:3000/api/auth/session/recover
      JWT_ACCESS_SECRET: build-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: build-only-refresh-secret-at-least-32-characters
      NAJM_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      ADMIN_EMAIL: admin@example.invalid
      ADMIN_PASSWORD: build-only-admin-password-not-used-000000
      NEXT_PUBLIC_FORM_FILL_ENABLED: "false"
      EMAIL_PROVIDER: console
      EMAIL_DEFAULT_FROM: no-reply@example.invalid
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify the complete root contract
        run: bun run check
      - name: Verify isolated demo and customer Compose configurations
        run: bun scripts/check-production-compose.mjs
      - name: Check the build has no installation domain
        run: |
          if rg -l 'myscolai\.com|jhlschool\.com' apps/dashboard/.next/server apps/dashboard/.next/static; then
            echo '::error::An installation domain was baked into the reusable build.'
            exit 1
          else
            result=$?
            test "$result" -eq 1
          fi

  publish:
    name: Build and publish image
    needs: [classify, verify]
    if: ${{ needs.classify.outputs.runtime_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set image creation time
        id: created
        run: echo "value=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            OCI_CREATED=${{ steps.created.outputs.value }}
            OCI_REVISION=${{ github.sha }}
      - name: Record the immutable release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n \
            --arg revision "$GITHUB_SHA" \
            --arg image "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{revision: $revision, image: $image, buildRun: $run}' > release.json
          echo "### Published release" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Customer promotion is manual in Dokploy after demo acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save release details
        uses: actions/upload-artifact@v4
        with:
          name: school-release-${{ github.sha }}
          path: release.json
          retention-days: 90

  deploy:
    name: Deploy and verify demo through Dokploy
    needs: publish
    if: ${{ vars.DEMO_DEPLOY_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      packages: write
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Point demo at this published image
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEMO_DEPLOY_WEBHOOK }}
        run: |
          test -n "$DOKPLOY_DEPLOY_WEBHOOK"
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:demo" "${IMAGE_NAME}@${IMAGE_DIGEST}"
          actual_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:demo" --format '{{json .Manifest}}' | jq -r '.digest')"
          test "$actual_digest" = "$IMAGE_DIGEST"
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEMO_DEPLOY_WEBHOOK }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          test -n "$DOKPLOY_DEPLOY_WEBHOOK"
          if [ -z "$DEPLOY_MESSAGE" ]; then
            DEPLOY_MESSAGE="Deploy ${GITHUB_SHA}"
          fi
          payload="$(
            jq -n \
              --arg ref "$GITHUB_REF" \
              --arg after "$GITHUB_SHA" \
              --arg message "$DEPLOY_MESSAGE" \
              '{ref: $ref, after: $after, head_commit: {id: $after, message: $message}, commits: []}'
          )"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "$payload" \
            "$DOKPLOY_DEPLOY_WEBHOOK"

      - name: Verify deployed revision is serving
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 900))
          revision_url="https://myscolai.com/deployment-revision.txt?revision=${DEPLOY_REVISION}"
          last_revision="unavailable"
          last_apex_status="000"
          last_www_status="000"
          last_readiness_status="000"

          while (( SECONDS < deadline )); do
            last_revision="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                "$revision_url" \
                2>/dev/null || true
            )"

            if [ "$last_revision" = "$DEPLOY_REVISION" ]; then
              last_apex_status="$(
                curl \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 20 \
                  https://myscolai.com/login || true
              )"
              last_www_status="$(
                curl \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 20 \
                  https://www.myscolai.com/login || true
              )"
              last_readiness_status="$(
                curl \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 20 \
                  https://myscolai.com/api/health/status || true
              )"

              if [ "$last_apex_status" = "200" ] && [ "$last_www_status" = "200" ] && [ "$last_readiness_status" = "200" ]; then
                echo "Revision $DEPLOY_REVISION is serving with database and cache ready."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::Dokploy accepted the webhook, but revision $DEPLOY_REVISION did not become ready within 15 minutes (served revision: $last_revision, apex: $last_apex_status, www: $last_www_status, readiness: $last_readiness_status)."
          exit 1
      - name: Record successful demo deployment
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          echo '### Demo deployment verified' >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Customer candidate: ${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Test the demo workflows before manually selecting this image in customer Dokploy.' >> "$GITHUB_STEP_SUMMARY"
