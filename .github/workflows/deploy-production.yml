name: Verify, publish, and deploy School

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: school-production-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14
  IMAGE_NAME: ghcr.io/hdevlop/school
  NEXT_PUBLIC_FORM_FILL_ENABLED: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql://build:build@127.0.0.1:5432/build
      NEXT_PUBLIC_APP_URL: https://demo.example.invalid
      FRONTEND_URL: https://demo.example.invalid
      NAJM_AUTH_INTERNAL_URL: http://127.0.0.1:3000/api/auth/session/recover
      JWT_ACCESS_SECRET: build-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: build-only-refresh-secret-at-least-32-characters
      NAJM_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      ADMIN_EMAIL: admin@example.invalid
      ADMIN_PASSWORD: build-only-admin-password-not-used-000000
      NEXT_PUBLIC_FORM_FILL_ENABLED: "false"
      EMAIL_PROVIDER: console
      EMAIL_DEFAULT_FROM: no-reply@example.invalid
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test server
        run: bun run test:server
      - name: Test dashboard
        run: bun run test:dashboard
      - name: Test seed
        run: bun run test:seed
      - name: Production build
        run: bun run build:all

  publish:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set image creation time
        id: created
        run: echo "value=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          build-args: |
            OCI_CREATED=${{ steps.created.outputs.value }}
            OCI_REVISION=${{ github.sha }}
            NEXT_PUBLIC_APP_URL=https://myscolai.com
            FRONTEND_URL=https://myscolai.com

  deploy:
    name: Deploy through Dokploy
    needs: publish
    runs-on: ubuntu-latest
    environment: production-vps
    permissions:
      contents: read
      packages: read
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_SCHOOL_DEPLOY_WEBHOOK }}
          DEPLOY_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          test -n "$DOKPLOY_DEPLOY_WEBHOOK"
          if [ -z "$DEPLOY_MESSAGE" ]; then
            DEPLOY_MESSAGE="Deploy ${GITHUB_SHA}"
          fi
          payload="$(
            jq -n \
              --arg ref "$GITHUB_REF" \
              --arg after "$GITHUB_SHA" \
              --arg message "$DEPLOY_MESSAGE" \
              '{ref: $ref, after: $after, head_commit: {message: $message}, commits: []}'
          )"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Event: push" \
            --data "$payload" \
            "$DOKPLOY_DEPLOY_WEBHOOK"

      - name: Verify deployed revision is serving
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 900))
          revision_url="https://myscolai.com/deployment-revision.txt?revision=${DEPLOY_REVISION}"
          last_revision="unavailable"
          last_apex_status="000"
          last_www_status="000"

          while (( SECONDS < deadline )); do
            last_revision="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 10 \
                "$revision_url" \
                2>/dev/null || true
            )"

            if [ "$last_revision" = "$DEPLOY_REVISION" ]; then
              last_apex_status="$(
                curl \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 20 \
                  https://myscolai.com/login || true
              )"
              last_www_status="$(
                curl \
                  --silent \
                  --show-error \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --max-time 20 \
                  https://www.myscolai.com/login || true
              )"

              if [ "$last_apex_status" = "200" ] && [ "$last_www_status" = "200" ]; then
                echo "Revision $DEPLOY_REVISION is serving on both production hostnames."
                exit 0
              fi
            fi

            sleep 10
          done

          echo "::error::Dokploy accepted the webhook, but revision $DEPLOY_REVISION did not become ready within 15 minutes (served revision: $last_revision, apex: $last_apex_status, www: $last_www_status)."
          exit 1
